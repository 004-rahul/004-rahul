<svg width="1200" height="210" viewBox="0 0 1200 210" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
.bg{fill:#F8FBFF}.t{font-family:Arial,sans-serif;fill:#17253A}.sub{font-family:Arial,sans-serif;fill:#64748B}.n{font-family:Arial,sans-serif;font-weight:800;fill:#0F7B55}.arrow{stroke:#718096;stroke-width:2}.dash{stroke:#1AA36F;stroke-width:2;stroke-dasharray:8 9;animation:f 2.8s linear infinite}@keyframes f{to{stroke-dashoffset:-70}}
.card{fill:white;stroke:#DDE7F2}
</style>
<rect width="1200" height="210" rx="18" class="bg"/>
<rect x="18" y="18" width="565" height="174" rx="14" class="card"/>
<rect x="601" y="18" width="581" height="174" rx="14" class="card"/>
<text x="42" y="50" class="t" font-size="19" font-weight="700">EMAIL PROCESSING</text>
<text x="42" y="76" class="sub" font-size="13">Sequential → event-driven processing</text>
<text x="42" y="124" class="t" font-size="24" font-weight="800">7–10 hours</text>
<path d="M205 116H340" class="dash"/><path d="M340 116L328 109M340 116L328 123" class="arrow"/>
<text x="365" y="124" class="n" font-size="24">~1–1.5 hours</text>
<text x="42" y="153" class="sub" font-size="12">SES + EventBridge + SQS + concurrent consumers</text>
<text x="42" y="178" class="n" font-size="13" font-weight="700">≈ 80% faster</text>

<text x="625" y="50" class="t" font-size="19" font-weight="700">DOCUMENT ELIGIBILITY</text>
<text x="625" y="76" class="sub" font-size="13">Set-based execution over large document workloads</text>
<text x="625" y="124" class="t" font-size="24" font-weight="800">3M → 6M documents</text>
<path d="M880 116H945" class="dash"/><path d="M945 116L933 109M945 116L933 123" class="arrow"/>
<text x="968" y="124" class="n" font-size="24">3–4 min</text>
<text x="625" y="153" class="sub" font-size="12">11 similar queries → 2 set-based executions</text>
<text x="625" y="178" class="n" font-size="13" font-weight="700">≈ 3–5× faster processing</text>
</svg>