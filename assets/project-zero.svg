<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 450" width="900" height="450" role="img" aria-label="Project Zero concept: existing business systems connect through data, tools and knowledge into Project Zero, then AI and intelligence, then business work.">
