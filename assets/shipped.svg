<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Production results: email processing 7 to 10 hours down to about 1 to 1.5 hours; documents 3M to 6M, 15 to 20 minutes down to 3 to 4 minutes.">
<title>Production results: email processing 7 to 10 hours down to about 1 to 1.5 hours; documents 3M to 6M, 15 to 20 minutes down to 3 to 4 minutes.</title>
<defs>
<linearGradient id="acc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4f9cf9"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<linearGradient id="fade" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4f9cf9" stop-opacity="0"/><stop offset=".5" stop-color="#4f9cf9" stop-opacity=".9"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></linearGradient>
<radialGradient id="vig" cx=".5" cy=".5" r=".75"><stop offset=".55" stop-color="#0b0f14" stop-opacity="0"/><stop offset="1" stop-color="#0b0f14" stop-opacity=".85"/></radialGradient>
<pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#151d29" stroke-width="1"/><animateTransform attributeName="patternTransform" type="translate" from="0 0" to="30 30" dur="12s" repeatCount="indefinite"/></pattern>
</defs>
<rect width="900" height="330" rx="14" fill="#0b0f14"/>
<rect x="20" y="20" width="420" height="290" rx="12" fill="#11171f" stroke="#1f2937"/>
<text x="46" y="58" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="3" fill="#5b6b80">EMAIL PROCESSING</text>
<text x="46" y="120" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="700" fill="#8b98a9">7–10h</text>
<text x="190" y="118" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="30" fill="#5b6b80">→</text>
<text x="235" y="120" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="40" font-weight="700" fill="#3ddc97">~1–1.5h</text>
<rect x="46" y="150" width="368" height="8" rx="4" fill="#2a3441"/>
<rect x="46" y="166" width="368" height="8" rx="4" fill="#3ddc97"><animate attributeName="width" values="368;368;56;56;368" keyTimes="0;.1;.4;.95;1" dur="8s" repeatCount="indefinite"/></rect>
<rect x="46" y="196" width="130" height="28" rx="14" fill="#3ddc97" fill-opacity=".1" stroke="#3ddc97" stroke-opacity=".5"/>
<text x="111.0" y="215" text-anchor="middle" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#3ddc97">≈ 80% faster</text>
<text x="46" y="264" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#8b98a9">AWS SES · EventBridge · SQS</text>
<text x="46" y="284" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#8b98a9">Concurrent consumers</text>
<rect x="460" y="20" width="420" height="290" rx="12" fill="#11171f" stroke="#1f2937"/>
<text x="486" y="58" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="3" fill="#5b6b80">DATA PROCESSING</text>
<text x="486" y="112" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="700" fill="#e6edf3">3M → 6M</text>
<text x="682" y="112" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#8b98a9">documents</text>
<text x="486" y="154" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#8b98a9">15–20 min <tspan fill="#5b6b80">→</tspan> <tspan font-weight="700" fill="#3ddc97">3–4 min</tspan></text>
<rect x="486" y="174" width="368" height="8" rx="4" fill="#2a3441"/>
<rect x="486" y="190" width="368" height="8" rx="4" fill="#3ddc97"><animate attributeName="width" values="368;368;70;70;368" keyTimes="0;.1;.4;.95;1" dur="8s" repeatCount="indefinite"/></rect>
<rect x="486" y="220" width="130" height="28" rx="14" fill="#3ddc97" fill-opacity=".1" stroke="#3ddc97" stroke-opacity=".5"/>
<text x="551.0" y="239" text-anchor="middle" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" fill="#3ddc97">3–5x faster</text>
<text x="486" y="284" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12" fill="#8b98a9">11 queries → 2 set-based executions</text>
</svg>
