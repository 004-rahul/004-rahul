<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380">
<defs>
<linearGradient id="card" x1="0" x2="1"><stop stop-color="#0a1424"/><stop offset="1" stop-color="#0d1b2e"/></linearGradient>
<filter id="gl"><feGaussianBlur stdDeviation="7"/></filter>
<style>
 .packet{animation:move 5s linear infinite}
 .packet2{animation:move 5s linear infinite 1.25s}
 .packet3{animation:move 5s linear infinite 2.5s}
 .heartbeat{animation:hb 2s ease-in-out infinite}
 @keyframes move{from{transform:translateX(0);opacity:0}8%{opacity:1}92%{opacity:1}to{transform:translateX(700px);opacity:0}}
 @keyframes hb{50%{opacity:.35}}
</style></defs>
<rect width="1200" height="380" rx="24" fill="#050914"/>
<text x="55" y="55" font-family="JetBrains Mono,monospace" font-size="15" fill="#72dff7">DISTRIBUTED EXECUTION / FAILURE-AWARE BACKEND</text>
<g stroke="#193b55" stroke-width="3" fill="none">
<path d="M170 190H1030"/><path d="M650 190V100"/><path d="M650 190V280"/>
</g>
<g class="heartbeat">
<rect x="55" y="150" width="115" height="80" rx="16" fill="url(#card)" stroke="#35dfff" stroke-opacity=".7"/>
<text x="112" y="184" text-anchor="middle" font-family="JetBrains Mono" font-size="16" fill="#fff">.NET API</text>
<text x="112" y="207" text-anchor="middle" font-family="JetBrains Mono" font-size="10" fill="#6c9eb4">REQUEST</text>
<rect x="310" y="150" width="115" height="80" rx="16" fill="url(#card)" stroke="#35dfff" stroke-opacity=".7"/>
<text x="367" y="184" text-anchor="middle" font-family="JetBrains Mono" font-size="16" fill="#fff">QUEUE</text>
<text x="367" y="207" text-anchor="middle" font-family="JetBrains Mono" font-size="10" fill="#6c9eb4">EVENT</text>
<rect x="590" y="55" width="120" height="80" rx="16" fill="url(#card)" stroke="#7d79ff" stroke-opacity=".8"/>
<text x="650" y="89" text-anchor="middle" font-family="JetBrains Mono" font-size="15" fill="#fff">WORKERS</text>
<text x="650" y="112" text-anchor="middle" font-family="JetBrains Mono" font-size="10" fill="#8e8be0">CONCURRENCY</text>
<rect x="590" y="240" width="120" height="80" rx="16" fill="url(#card)" stroke="#7d79ff" stroke-opacity=".8"/>
<text x="650" y="274" text-anchor="middle" font-family="JetBrains Mono" font-size="15" fill="#fff">RAG / AI</text>
<text x="650" y="297" text-anchor="middle" font-family="JetBrains Mono" font-size="10" fill="#8e8be0">REASONING</text>
<rect x="880" y="150" width="115" height="80" rx="16" fill="url(#card)" stroke="#35e6b0" stroke-opacity=".75"/>
<text x="937" y="184" text-anchor="middle" font-family="JetBrains Mono" font-size="15" fill="#fff">DATA</text>
<text x="937" y="207" text-anchor="middle" font-family="JetBrains Mono" font-size="10" fill="#5bbd9c">STATE</text>
</g>
<g class="packet"><circle cx="170" cy="190" r="6" fill="#42e9ff" filter="url(#gl)"/><circle cx="170" cy="190" r="3" fill="#d8fbff"/></g>
<g class="packet2"><circle cx="170" cy="190" r="6" fill="#42e9ff" filter="url(#gl)"/><circle cx="170" cy="190" r="3" fill="#d8fbff"/></g>
<g class="packet3"><circle cx="170" cy="190" r="6" fill="#42e9ff" filter="url(#gl)"/><circle cx="170" cy="190" r="3" fill="#d8fbff"/></g>
<g font-family="JetBrains Mono" font-size="11" fill="#557f96">
<text x="235" y="175">retry</text><text x="235" y="215">idempotency</text>
<text x="750" y="175">p95 / p99</text><text x="750" y="215">observability</text>
</g>
<text x="600" y="356" text-anchor="middle" font-family="JetBrains Mono" font-size="11" fill="#668da1">FAILURE → RETRY → RECOVERY → MEASURE</text>
</svg>