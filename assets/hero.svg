<text x="280" y="283" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" letter-spacing="3" fill="#5b6b80">SQL<animate attributeName="fill" values="#5b6b80;#e6edf3;#5b6b80" dur="6s" begin="0.7s" repeatCount="indefinite"/></text>
<path d="M280 294 C280 318 450 312 450 334" fill="none" stroke="#4f9cf9" stroke-opacity=".5" stroke-width="1" stroke-dasharray="3 6"><animate attributeName="stroke-dashoffset" from="18" to="0" dur="1.8s" repeatCount="indefinite"/></path>
<text x="450" y="283" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" letter-spacing="3" fill="#5b6b80">AWS<animate attributeName="fill" values="#5b6b80;#e6edf3;#5b6b80" dur="6s" begin="1.4s" repeatCount="indefinite"/></text>
<path d="M450 294 C450 318 450 312 450 334" fill="none" stroke="#4f9cf9" stroke-opacity=".5" stroke-width="1" stroke-dasharray="3 6"><animate attributeName="stroke-dashoffset" from="18" to="0" dur="1.8s" repeatCount="indefinite"/></path>
<text x="620" y="283" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" letter-spacing="3" fill="#5b6b80">QUEUES<animate attributeName="fill" values="#5b6b80;#e6edf3;#5b6b80" dur="6s" begin="2.0999999999999996s" repeatCount="indefinite"/></text>
<path d="M620 294 C620 318 450 312 450 334" fill="none" stroke="#4f9cf9" stroke-opacity=".5" stroke-width="1" stroke-dasharray="3 6"><animate attributeName="stroke-dashoffset" from="18" to="0" dur="1.8s" repeatCount="indefinite"/></path>
<text x="790" y="283" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="14" letter-spacing="3" fill="#5b6b80">SCALE<animate attributeName="fill" values="#5b6b80;#e6edf3;#5b6b80" dur="6s" begin="2.8s" repeatCount="indefinite"/></text>
<path d="M790 294 C790 318 450 312 450 334" fill="none" stroke="#4f9cf9" stroke-opacity=".5" stroke-width="1" stroke-dasharray="3 6"><animate attributeName="stroke-dashoffset" from="18" to="0" dur="1.8s" repeatCount="indefinite"/></path>
<text x="450" y="352" text-anchor="middle" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="7" fill="#e6edf3">ENGINEERING</text>
<path d="M450 360 V376 M445 371 L450 377 L455 371" fill="none" stroke="#8b98a9" stroke-width="1.2"/>
<text x="450" y="394" text-anchor="middle" font-family="'Segoe UI', -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="7" fill="url(#acc)">AI SYSTEMS<animate attributeName="opacity" values="1;.55;1" dur="4s" repeatCount="indefinite"/></text>
