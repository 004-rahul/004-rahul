<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360">
<defs>
<radialGradient id="core"><stop stop-color="#dffcff"/><stop offset=".18" stop-color="#4de8ff"/><stop offset=".7" stop-color="#1260ff" stop-opacity=".45"/><stop offset="1" stop-opacity="0"/></radialGradient>
<linearGradient id="line"><stop stop-color="#1ee7ff" stop-opacity="0"/><stop offset=".5" stop-color="#1ee7ff"/><stop offset="1" stop-color="#7d6dff" stop-opacity="0"/></linearGradient>
<filter id="g"><feGaussianBlur stdDeviation="10"/></filter>
<style>
 .rot{transform-origin:600px 180px;animation:r 16s linear infinite}
 .rot2{transform-origin:600px 180px;animation:r2 23s linear infinite}
 .float{animation:f 4s ease-in-out infinite alternate}
 .flow{stroke-dasharray:12 18;animation:flow 2.5s linear infinite}
 @keyframes r{to{transform:rotate(360deg)}} @keyframes r2{to{transform:rotate(-360deg)}}
 @keyframes f{to{transform:translateY(-8px)}} @keyframes flow{to{stroke-dashoffset:-60}}
</style></defs>
<rect width="1200" height="360" rx="24" fill="#050914"/>
<g opacity=".18" stroke="#17314b"><path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200M0 300H1200"/><path d="M100 0V360M200 0V360M300 0V360M900 0V360M1000 0V360M1100 0V360"/></g>
<g class="rot" fill="none" stroke="#25dcff" stroke-opacity=".4">
 <ellipse cx="600" cy="180" rx="210" ry="62"/><ellipse cx="600" cy="180" rx="180" ry="45" transform="rotate(65 600 180)"/>
</g>
<g class="rot2" fill="none" stroke="#746cff" stroke-opacity=".28"><ellipse cx="600" cy="180" rx="250" ry="85" transform="rotate(-25 600 180)"/></g>
<circle cx="600" cy="180" r="70" fill="#27dfff" opacity=".12" filter="url(#g)"/><circle cx="600" cy="180" r="47" fill="url(#core)"/>
<text x="600" y="186" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="18" font-weight="700" fill="#fff">AI CORE</text>

<g class="float">
<rect x="95" y="58" width="190" height="54" rx="14" fill="#0a1526" stroke="#28dfff" stroke-opacity=".5"/>
<text x="190" y="91" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="15" fill="#bff7ff">LLM / REASONING</text>
<rect x="95" y="248" width="190" height="54" rx="14" fill="#0a1526" stroke="#28dfff" stroke-opacity=".5"/>
<text x="190" y="281" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="15" fill="#bff7ff">RAG / RETRIEVAL</text>
<rect x="915" y="58" width="190" height="54" rx="14" fill="#0a1526" stroke="#786fff" stroke-opacity=".6"/>
<text x="1010" y="91" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="15" fill="#d9d5ff">MCP / TOOLS</text>
<rect x="915" y="248" width="190" height="54" rx="14" fill="#0a1526" stroke="#786fff" stroke-opacity=".6"/>
<text x="1010" y="281" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="15" fill="#d9d5ff">AGENTS / WORKFLOWS</text>
</g>
