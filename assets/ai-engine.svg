<path d="M285 85C410 85 455 130 550 160"/><path d="M285 275C410 275 455 225 550 200"/>
<path d="M915 85C790 85 745 130 650 160"/><path d="M915 275C790 275 745 225 650 200"/>
</g>
</svg>