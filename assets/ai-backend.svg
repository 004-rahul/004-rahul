<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 320" width="900" height="320" role="img" aria-label="Backend engineering (APIs, data, queues, caching, distributed systems, security) leads to AI backend systems (LLMs, retrieval, RAG, tools, MCP, agents), which leads to Project Zero.">
