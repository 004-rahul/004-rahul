<svg width="1200" height="330" viewBox="0 0 1200 330" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
.bg{fill:#F8FBFF}.line{fill:none;stroke-linecap:round;stroke-width:2}
.label{font-family:Arial,sans-serif;font-size:15px;fill:#26364A;font-weight:600}
.small{font-family:Arial,sans-serif;font-size:12px;fill:#607086}
.stack{stroke:#D8E6F5;stroke-width:1}
.pulse{stroke-dasharray:9 13;animation:flow 3.8s linear infinite}
.p2{animation-delay:-1.2s}.p3{animation-delay:-2.1s}.p4{animation-delay:-2.8s}
@keyframes flow{to{stroke-dashoffset:-160}}
@keyframes breathe{0%,100%{transform:translateY(0);opacity:.9}50%{transform:translateY(-5px);opacity:1}}
@keyframes glow{0%,100%{opacity:.35}50%{opacity:.8}}
.core{animation:breathe 4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
</style>
<rect width="1200" height="330" rx="18" class="bg"/>
<g opacity=".18"><path d="M0 65H1200M0 130H1200M0 195H1200M0 260H1200" stroke="#BFD3E8"/><path d="M120 0V330M240 0V330M960 0V330M1080 0V330" stroke="#BFD3E8"/></g>

<g>
<text x="48" y="52" class="label">IDEAS</text><circle cx="28" cy="47" r="6" fill="#1677FF"/>
<text x="48" y="112" class="label">USERS</text><circle cx="28" cy="107" r="6" fill="#18A999"/>
<text x="48" y="172" class="label">DATA</text><circle cx="28" cy="167" r="6" fill="#7A5CFA"/>
<text x="48" y="232" class="label">EVENTS</text><circle cx="28" cy="227" r="6" fill="#FF9F1C"/>
<text x="48" y="292" class="label">INTEGRATIONS</text><circle cx="28" cy="287" r="6" fill="#E84A8A"/>
</g>

<g>
<text x="1050" y="52" class="label">AUTOMATION</text><circle cx="1028" cy="47" r="6" fill="#1677FF"/>
<text x="1050" y="112" class="label">INSIGHTS</text><circle cx="1028" cy="107" r="6" fill="#18A999"/>
<text x="1050" y="172" class="label">PRODUCTIVITY</text><circle cx="1028" cy="167" r="6" fill="#7A5CFA"/>
<text x="1050" y="232" class="label">SCALABILITY</text><circle cx="1028" cy="227" r="6" fill="#FF9F1C"/>
<text x="1050" y="292" class="label">REAL IMPACT</text><circle cx="1028" cy="287" r="6" fill="#E84A8A"/>
</g>

<g class="core">
<path d="M390 78L600 40L810 78L600 118L390 78Z" fill="#6B4CFF" opacity=".9" class="stack"/>
<path d="M390 78V132L600 172L810 132V78L600 118L390 78Z" fill="#5C7CFF" opacity=".72" class="stack"/>
<path d="M390 132V186L600 226L810 186V132L600 172L390 132Z" fill="#20B77A" opacity=".82" class="stack"/>
<text x="540" y="92" fill="white" font-family="Arial" font-size="18" font-weight="700">AI SYSTEMS</text>
<text x="527" y="151" fill="white" font-family="Arial" font-size="18" font-weight="700">DISTRIBUTED</text>
<text x="545" y="171" fill="white" font-family="Arial" font-size="14" font-weight="700">SYSTEMS</text>
<text x="518" y="207" fill="white" font-family="Arial" font-size="18" font-weight="700">BACKEND SYSTEMS</text>
</g>

<path class="line pulse" d="M34 47C180 47 260 48 390 78" stroke="#1677FF"/>
<path class="line pulse p2" d="M34 107C190 107 280 105 390 105" stroke="#18A999"/>
<path class="line pulse p3" d="M34 167C190 167 280 155 390 140" stroke="#7A5CFA"/>
<path class="line pulse p4" d="M34 227C190 227 280 190 390 160" stroke="#FF9F1C"/>
<path class="line pulse p2" d="M34 287C190 287 280 215 390 180" stroke="#E84A8A"/>
<path class="line pulse" d="M810 78C930 48 1010 47 1028 47" stroke="#1677FF"/>
<path class="line pulse p2" d="M810 105C930 107 1000 107 1028 107" stroke="#18A999"/>
<path class="line pulse p3" d="M810 140C930 167 1000 167 1028 167" stroke="#7A5CFA"/>
<path class="line pulse p4" d="M810 160C930 227 1000 227 1028 227" stroke="#FF9F1C"/>
<path class="line pulse p2" d="M810 180C930 287 1000 287 1028 287" stroke="#E84A8A"/>
</svg>