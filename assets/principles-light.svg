<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="218" viewBox="0 0 1180 218" role="img" aria-label="Somewhere between imagination and belief, dreams become reality. And every reality begins as a dream."><title>Somewhere between imagination and belief, dreams become reality. And every reality begins as a dream.</title><style>text{font-family:"Segoe UI",Arial,sans-serif} .caps{font-size:12px;letter-spacing:1.2px;font-weight:600} @media(prefers-reduced-motion:reduce){.motion{display:none}}</style><defs><linearGradient id="principle-wash" x2="1" y2="1"><stop stop-color="#F6F8FC"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient></defs><rect x="1" y="1" width="1178" height="216" rx="14" fill="url(#principle-wash)" stroke="#D4DEED"/><path d="M33 35V183" stroke="#0969DA" stroke-width="3" stroke-linecap="round"/><text x="62" y="43" font-size="12" fill="#0969DA" class="caps">FROM IMAGINATION TO REALITY</text><text x="62" y="92" font-size="27" fill="#1F2937" font-weight="500">Somewhere between imagination and belief,</text><text x="62" y="131" font-size="27" fill="#1F2937" font-weight="500">dreams become reality.</text><text x="62" y="181" font-size="24" fill="#0969DA" >And every reality begins as a dream.</text></svg>